name: Ons Huis checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - name: PostgreSQL transaction and RLS tests
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f tests/database/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f tests/database/integration.sql
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
